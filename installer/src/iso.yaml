# titanoboa / bootc-image-builder ISO config. build_iso.sh reads `.label` (the
# ISO volume label, which must match root=live:CDLABEL= below) and `.grub2.*`.
#"vt.global_cursor_default=0",
#"plymouth.ignore-serial-consoles"
label: "inver-live"
grub2:
  timeout: 10
  default: 0
  entries:
    - name: "Launch Inver (ReadyMade)"
      linux: "/images/pxeboot/vmlinuz quiet splash rhgb root=live:CDLABEL=inver-live enforcing=0 vt.global_cursor_default=0 plymouth.ignore-serial-consoles rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Launch Inver (ReadyMade, Fallback Graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=inver-live enforcing=0 vt.global_cursor_default=0 plymouth.ignore-serial-consoles rd.live.image nomodeset nordrand amdgpu.modeset=0"
      initrd: "/images/pxeboot/initrd.img"
