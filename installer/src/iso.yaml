# titanoboa / bootc-image-builder ISO config. build_iso.sh reads `.label` (the
# ISO volume label, which must match root=live:CDLABEL= below) and `.grub2.*`.
label: "inver-live"
grub2:
  timeout: 10
  default: 0
  entries:
    - name: "Launch Inver Anaconda"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=inver-live enforcing=0 rd.live.image"
      initrd: "/images/pxeboot/initrd.img"
    - name: "Launch Inver Anaconda (Fallback Graphics)"
      linux: "/images/pxeboot/vmlinuz quiet rhgb root=live:CDLABEL=inver-live enforcing=0 rd.live.image nomodeset nordrand amdgpu.modeset=0"
      initrd: "/images/pxeboot/initrd.img"
